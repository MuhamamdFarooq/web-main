<head>

    <title>class and id</title>
    <style>
        h1,p{
            border: 2px solid red;
          
        }

        #header{
            background-color: rgb(234, 12, 186);
        }

        .A{
            background-color: rgb(255, 0, 0);
        }
        

    </style>
</head>
<body>
    <h1 id="header">this is id</h1>

    <p class="A">this is second </p>
    <p class="A">this is third</p>
    
</body>
</html>
